  api:
    build:
      context: ./nexus-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - commandix-production
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # DATABASE_URL: postgresql://${DB_USERNAME:-commandix}:${DB_PASSWORD:-commandix}@postgres:${POSTGRES_PORT:-5432}/${DB_DATABASE:-commandix}
      # JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access}
      # JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      # JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      # JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: ${API_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:${API_PORT:-3000}/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

