name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nexus-backend

env:
  DATABASE_URL: postgresql://commandix:commandix@localhost:5432/commandix
  JWT_ACCESS_SECRET: ci-access-secret
  JWT_REFRESH_SECRET: ci-refresh-secret

jobs:
  validate:
    name: Lint, test & build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commandix
          POSTGRES_PASSWORD: commandix
          POSTGRES_DB: commandix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commandix -d commandix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: nexus-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Emit Prisma contract
        run: npm run contract:emit

      - name: Verify generated contract is committed
        run: |
          git diff --exit-code src/prisma/contract.json src/prisma/contract.d.ts

      - name: Apply migrations
        run: npx prisma db migrate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
