services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-commandix}
      POSTGRES_USER: ${DB_USERNAME:-commandix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-commandix}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - database_dev_data:/var/lib/postgresql/data
      - ./nexus-backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    networks:
      - commandix-dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./nexus-backend
      dockerfile: docker/development/Dockerfile
      network: host
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${API_PORT:-3000}:3000"
      - "${API_DEBUG_PORT:-9229}:9229"
    volumes:
      - ./nexus-backend:/app
      - api_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      PRISMA_DISABLE_TELEMETRY: "1"

      DATABASE_URL: postgresql://${DB_USERNAME:-commandix}:${DB_PASSWORD:-commandix}@database:5432/${DB_DATABASE:-commandix}
      TEST_DATABASE_URL: postgresql://${DB_USERNAME:-commandix}:${DB_PASSWORD:-commandix}@database:5432/commandix_test

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      HTTP_TRIGGER_TIMEOUT_MS: ${HTTP_TRIGGER_TIMEOUT_MS:-30000}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - commandix-dev

  frontend:
    build:
      context: ./nexus-frontend
      dockerfile: docker/development/Dockerfile
      network: host
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./nexus-frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      - api
    networks:
      - commandix-dev

  n8n-import:
    image: n8nio/n8n:2.37.11
    restart: "no"
    entrypoint: sh
    command:
      - -c
      - |
        set -e
        for f in /workflows/*.json; do
          echo "importando $$f"
          n8n import:workflow --input="$$f"
        done
        for id in $$(node -e "
          const fs = require('fs');
          for (const f of fs.readdirSync('/workflows')) {
            if (!f.endsWith('.json')) continue;
            const data = JSON.parse(fs.readFileSync('/workflows/' + f, 'utf8'));
            for (const wf of (Array.isArray(data) ? data : [data])) {
              if (wf.active) console.log(wf.id);
            }
          }
        "); do
          echo "ativando $$id"
          n8n publish:workflow --id="$$id"
        done
    volumes:
      - n8n_dev_data:/home/node/.n8n
      - ./docker/n8n/workflows:/workflows:ro
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-encryption-key}
    networks:
      - commandix-dev

  n8n:
    image: n8nio/n8n:2.37.11
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_dev_data:/home/node/.n8n
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dev-n8n-encryption-key}
      N8N_WEBHOOK_URL: http://n8n:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-api-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-commandix}
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    networks:
      - commandix-dev
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  evolution-database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
    volumes:
      - evolution_dev_db_data:/var/lib/postgresql/data
    networks:
      - commandix-dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - evolution_dev_data:/evolution/instances
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-api-key}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution}@evolution-database:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_commandix
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: Commandix
      CONFIG_SESSION_PHONE_NAME: Chrome
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      evolution-database:
        condition: service_healthy
    networks:
      - commandix-dev
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

networks:
  commandix-dev:
    driver: bridge

volumes:
  database_dev_data:
  api_dev_node_modules:
  frontend_dev_node_modules:
  n8n_dev_data:
  evolution_dev_data:
  evolution_dev_db_data:
